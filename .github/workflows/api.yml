name: Teste and Deploy

on:
  push:
    branches: [main, dev]


jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      app: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'api/**'
            app:
              - 'app/**'


  unitTestApi:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Get Code from repository
        uses: actions/checkout@v6
      - name: verifica se fez corretamente
        run:  ls -la
      - name: Instala o Node na maquina virtual        
        uses: actions/setup-node@v3
      - name: Instala as dependencias do projeto
        working-directory: api 
        run: npm ci
      - name: Roda os testes
        working-directory: api 
        run: npm run test 
      - name: verifica se fez corretamente
        working-directory: api 
        run:  ls -la        
      - name: Gera relatorio de testes
        uses: dorny/test-reporter@v1
        if: success() || failure()  # roda de qualquer maneira
        with:
          name: JEST tests
          path: ./api/j*.xml
          reporter: jest-junit
          
  deploy-api:
    needs: unitTestApi
    if: success()    
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Project 1
        run: |
          RESPONSE=$(curl --fail --silent --show-error -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}')

          echo "Deploy response: $RESPONSE"

          DEPLOY_ID=$(echo $RESPONSE | jq -r '.id')
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "Deploy ID: $DEPLOY_ID"

      # 6. Aguardar o deploy finalizar (polling na API do Render)
      - name: Wait for deploy to complete
        run: |
          DEPLOY_ID="${{ steps.deploy.outputs.deploy_id }}"
          SERVICE_ID="${{ secrets.RENDER_SERVICE_ID }}"
          MAX_ATTEMPTS=30   # 30 x 20s = 10 minutos
          ATTEMPT=0

          echo "Aguardando deploy $DEPLOY_ID finalizar..."

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(curl --silent \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              | jq -r '.status')

            echo "Tentativa $((ATTEMPT + 1)) — Status: $STATUS"

            if [ "$STATUS" = "live" ]; then
              echo "✅ Deploy concluído com sucesso!"
              exit 0
            elif [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "deactivated" ] || [ "$STATUS" = "canceled" ]; then
              echo "❌ Deploy falhou com status: $STATUS"
              exit 1
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 20
          done

          echo "⏱️ Timeout: deploy não finalizou em 10 minutos"
          exit 1

      # 7. Health check na URL do serviço
      - name: Health check
        run: |
          URL="${{ secrets.RENDER_SERVICE_URL }}"
          MAX_ATTEMPTS=10
          ATTEMPT=0

          echo "Iniciando health check em $URL ..."

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 10 "$URL/health")

            echo "Tentativa $((ATTEMPT + 1)) — HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passou! Serviço está online."
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 10
          done

          echo "❌ Health check falhou após $MAX_ATTEMPTS tentativas"
          exit 1

      # 8. Notificar sucesso ou falha
      - name: Notify success
        if: success()
        run: echo "🚀 Deploy e health check concluídos com sucesso!"

      - name: Notify failure
        if: failure()
        run: echo "💥 Pipeline falhou. Verifique os logs acima."            